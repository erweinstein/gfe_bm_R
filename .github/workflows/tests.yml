name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  R-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install Rcpp (optional C++ engine for the exact algorithm)
        run: Rscript -e 'install.packages("Rcpp", repos = "https://cloud.r-project.org")'
      - name: Run tests
        run: Rscript tests/test_gfe.R
